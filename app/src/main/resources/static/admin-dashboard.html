<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Add Doctor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7fa;
            color: #333;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 40px;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 400;
            display: flex;
            align-items: center;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px 50px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1e3c72;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }

        /* Card */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            max-width: 800px;
        }

        .card h3 {
            margin-bottom: 25px;
            color: #2a5298;
            font-size: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #2a5298;
            box-shadow: 0 0 5px rgba(42, 82, 152, 0.2);
        }

        .full-width {
            grid-column: span 2;
        }

        .btn {
            background: #2a5298;
            color: #fff;
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            float: right;
        }

        .btn:hover {
            background: #1e3c72;
            transform: translateY(-2px);
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Smart Clinic</h2>
        <div class="nav-item">Dashboard</div>
        <div class="nav-item active">Add Doctor</div>
        <div class="nav-item">View Patients</div>
        <div class="nav-item">Appointments</div>
        <div class="nav-item" style="margin-top: auto;">Logout</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Doctor Management</h1>
            <div class="user-profile">
                <span>System Admin</span>
            </div>
        </div>

        <div class="card">
            <h3>Add New Doctor</h3>
            <form id="addDoctorForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Dr. Jane Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Specialty</label>
                        <select id="specialty" required>
                            <option value="">Select Specialty...</option>
                            <option value="Cardiologist">Cardiologist</option>
                            <option value="Neurologist">Neurologist</option>
                            <option value="Pediatrician">Pediatrician</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="General Practitioner">General Practitioner</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="jane.doe@smartclinic.com" required>
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" placeholder="+1 (555) 123-4567" required>
                    </div>
                </div>
                <button type="submit" class="btn">Save Doctor</button>
                <div style="clear: both;"></div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('addDoctorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const doctor = {
                name: document.getElementById('name').value,
                specialty: document.getElementById('specialty').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            try {
                // Connecting directly to our DoctorController POST /api/doctors endpoint
                const response = await fetch('/api/doctors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(doctor)
                });

                if (response.ok) {
                    alert('Doctor added successfully!');
                    document.getElementById('addDoctorForm').reset();
                } else {
                    alert('Error adding doctor. Please check details.');
                }
            } catch (err) {
                alert('Network error occurred.');
            }
        });
    </script>
</body>
</html>
